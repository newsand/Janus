# Generated by the quality-gate-lefthook skill. Same config for pre-commit (staged) and the Quality Run (working tree).
title = "quality-gate-lefthook"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and third-party paths"
paths = [
  '''(^|/)\.quality/''',
  '''(^|/)node_modules/''',
  '''(^|/)vendor/''',
  '''(^|/)\.venv/''',
  '''(^|/)graphify-out/''',
]

[[rules]]
id = "janus-api-key"
description = "Janus raw API key (jns_ + 64 hex, specs/05-non-negotiables.md)"
regex = '''\b(jns_[0-9a-fA-F]{64})\b'''
secretGroup = 1
keywords = ["jns_"]
